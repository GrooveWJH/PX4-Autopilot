module_name: mc_raptor
parameters:
    - group: Multicopter Raptor
      definitions:
        MC_RAPTOR_ENABLE:
            description:
                short: Enable Raptor flight mode
                long: |
                    When enabled, the Raptor flight mode will be available. Please set MC_RAPTOR_OFFB according to your use case.
            type: boolean
            default: false
            category: System
        MC_RAPTOR_VERBOS:
            description:
                short: Enable verbose output
                long: |
                    When enabled, the Raptor flight mode will print verbose output to the console.
            type: boolean
            default: false
            category: System

        MC_RAPTOR_OFFB:
            description:
                short: Enable Offboard mode replacement
                long: |
                    When enabled, the Raptor mode will replace the Offboard mode.
                    If disabled, the Raptor mode will be available as a separate external mode. In the latter case, Raptor will just hold the position, without requiring external setpoints. When Raptor replaces the Offboard mode, it requires external setpoints to be activated.
            type: boolean
            default: false
            category: System

        MC_RAPTOR_TRNS_T:
            description:
                short: Intref transition duration
                long: |
                    Duration of the smoothing transition when entering intref mode or re-anchoring/changing trajectories.
                    During this interval trajectory time is held at t=0, and the command is blended from current state to the trajectory start.
                    Set to 0 to disable position/velocity blending while keeping yaw continuity handling.
                    Effective transition time may be extended internally to satisfy the yaw slew-rate limit.
            type: float
            min: 0.0
            max: 10.0
            unit: s
            decimal: 2
            default: 2.0
            category: System

        MC_RAPTOR_TRNS_Y:
            description:
                short: Intref transition yaw rate limit
                long: |
                    Maximum yaw slew rate during intref transition smoothing.
                    Higher values make heading align faster; lower values make transitions softer.
            type: float
            min: 0.2
            max: 3.0
            unit: rad/s
            decimal: 2
            default: 0.8
            category: System

        MC_RAPTOR_INTREF:
            description:
                short: Configured default internal trajectory for intref mode
                long: |
                    Configured default internal trajectory for RAPTOR intref mode.
                    Runtime control is split into two command domains:
                    - `mc_raptor mode set <extref|intref|hold>` selects the active reference source.
                    - `mc_raptor intref set <trajectory> ...` configures internal trajectory parameters.
                    `intref set` does not switch source mode. Use `mode set intref` to activate internal reference.
                    Runtime commands:
                    - `mc_raptor mode show`
                    - `mc_raptor mode set <extref|intref|hold>`
                    - `mc_raptor intref list`
                    - `mc_raptor intref set lissajous <A> <B> <C> <fa> <fb> <fc> <duration> <ramp>`
                    - `mc_raptor intref set circle <radius_m> <speed_mps> <ramp_s>`
                    - `mc_raptor intref show`
            type: enum
            values:
                0: None
                1: Lissajous
                2: Circle
            default: 0
            category: System
